<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daire 31 — Gece 1</title>
<style>
:root{--bg:#0d0f0e;--fg:#d8d2b8;--dim:#8a8670;--acc:#c9b458;--panel:rgba(14,16,15,.92);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0d0f0e}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
#c{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--panel);z-index:5;text-align:center;padding:24px}
.hide{display:none!important}
h1{font-weight:400;font-size:clamp(34px,7vw,64px);letter-spacing:.04em;margin:0 0 6px}
p{max-width:520px;line-height:1.55;color:var(--dim);margin:8px 0}
button{font:inherit;background:none;color:var(--fg);border:1px solid var(--dim);padding:10px 22px;margin:6px;cursor:pointer}
button:hover,button:focus-visible{border-color:var(--acc);color:var(--acc);outline:none}
#hud{position:fixed;left:16px;top:calc(12px + env(safe-area-inset-top,0px));font-size:15px;text-shadow:0 1px 3px #000;z-index:3;pointer-events:none}
#hud b{color:var(--acc);font-weight:400}
#pr{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);font-size:18px;text-shadow:0 1px 4px #000;z-index:3;pointer-events:none}
#dot{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:#d8d2b8aa;border-radius:50%;z-index:3}
#msg{position:fixed;left:50%;top:22%;transform:translateX(-50%);width:min(560px,88vw);text-align:center;font-style:italic;font-size:19px;text-shadow:0 1px 4px #000;z-index:3;pointer-events:none;min-height:1em}
#nb,#rep{align-items:stretch;text-align:left}
.box{max-width:560px;width:100%;margin:auto}
.box li,.box label{line-height:1.5;margin:6px 0}
#cctv{background:#050806;color:#9fd0a0;font-family:'Courier New',monospace;z-index:4}
#cctv canvas{width:min(640px,94vw);height:auto;border:2px solid #3a4a3a}
.tb{position:fixed;z-index:3;width:64px;height:64px;border-radius:50%;background:rgba(20,22,20,.6);border:1px solid var(--dim);color:var(--fg);font:inherit;font-size:20px;padding:0;margin:0;touch-action:none;user-select:none;-webkit-user-select:none}
#bE{right:18px;bottom:calc(32px + env(safe-area-inset-bottom,0px))}
#bN{right:18px;top:calc(12px + env(safe-area-inset-top,0px));width:52px;height:52px}
#bL{right:80px;top:calc(12px + env(safe-area-inset-top,0px));width:52px;height:52px}
#js{position:fixed;z-index:3;width:110px;height:110px;border-radius:50%;border:1px solid var(--dim);background:rgba(20,22,20,.35);display:none;pointer-events:none}
#jk{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(216,210,184,.4)}
#c{touch-action:none}
#bub{position:fixed;left:16px;right:96px;max-width:640px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:rgba(14,16,15,.94);border:1px solid var(--dim);border-radius:20px 20px 20px 4px;padding:12px 18px;z-index:4;font-size:17px;line-height:1.45;cursor:pointer}
#bub b{display:block;color:var(--acc);font-weight:400;margin-bottom:2px}
#bc button{display:block;width:100%;text-align:left;margin:6px 0 0}
@keyframes jt{0%{transform:translate(0,0)}20%{transform:translate(-10px,5px)}40%{transform:translate(9px,-6px)}60%{transform:translate(-6px,-4px)}100%{transform:none}}
.jt canvas{animation:jt .5s}
#vg{position:fixed;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 12vmin 3vmin rgba(0,0,0,.5)}
</style></head><body>
<canvas id="c"></canvas><div id="dot"></div>
<div id="hud"></div><div id="msg"></div><div id="pr"></div><div id="bub" class="hide"><b id="bn"></b><span id="bt"></span><div id="bc"></div></div>
<button class="tb hide" id="bE">E</button><button class="tb hide" id="bN">📓</button><button class="tb hide" id="bL">L</button><div id="js"><div id="jk"></div></div>

<div class="ov" id="title">
<h1 id="tT"></h1><p id="tS"></p><p id="tH"></p>
<div><button id="s1"></button><button id="s2"></button><button id="s3"></button></div>
<div><button id="go"></button><button id="lg"></button></div></div>

<div class="ov hide" id="cctv"><canvas id="cv" width="480" height="300"></canvas><p id="cl" style="color:#9fd0a0"></p>
<div><button id="cn"></button><button id="cx"></button></div></div>

<div class="ov hide" id="nb"><div class="box"><h1 style="font-size:32px" id="nbT"></h1><ul id="nbL"></ul><button id="nbX"></button></div></div>

<div class="ov hide" id="rep"><div class="box"><h1 style="font-size:32px" id="rT"></h1><p id="rS"></p><div id="rL"></div><button id="rOk"></button></div></div>

<div class="ov hide" id="end"><h1 id="eT"></h1><p id="eS"></p><button id="again"></button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/models_chars.js"></script>
<script src="js/model_galina.js"></script>
<script src="js/game.js"></script>
</body></html>
